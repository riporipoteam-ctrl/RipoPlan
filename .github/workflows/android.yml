name: Build Android app (.apk)

# Builds the native Kotlin/Compose AskAI app (android/) into an installable APK
# and publishes it to a rolling "android-latest" pre-release so you can grab it
# straight on your phone (enable "Install unknown apps" and open the .apk).

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Version-stamp
        working-directory: android
        run: |
          VC=${{ github.run_number }}
          VN="1.0.${{ github.run_number }}"
          sed -i "s/versionCode = 1/versionCode = ${VC}/" app/build.gradle.kts
          sed -i "s/versionName = \"1.0.0\"/versionName = \"${VN}\"/" app/build.gradle.kts
          echo "VER=$VN" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate & rename APK
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK at: $APK"
          cp "$APK" AskAI.apk
          ls -lh AskAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AskAI-apk
          path: android/AskAI.apk
          if-no-files-found: error

      - name: Publish to rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AskAI Android (latest)
          prerelease: true
          body: |
            Installable **AskAI.apk** (v${{ env.VER }}) — the native Android app.

            **Install:** download the .apk on your phone, allow "Install unknown apps"
            for your browser/files app when prompted, then open it. Powered by Parable 6.
          files: |
            android/AskAI.apk
